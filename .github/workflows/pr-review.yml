name: AI Frontend PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate PR diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt
          echo "Diff generated in diff.txt"

      - name: Run AI review with fallback
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          export MAX_CHUNK_BYTES=80000
          mkdir -p chunk_reviews

          # Split on file boundaries and keep only frontend-oriented files.
          # If a file block is too large, split by hunks, then by lines.
          MAX_CHUNK_BYTES="${MAX_CHUNK_BYTES}" python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          MAX = int(os.environ["MAX_CHUNK_BYTES"])
          raw = Path("diff.txt").read_text(encoding="utf-8", errors="replace")

          if not raw.strip():
              Path(".skip_ai").write_text("empty_diff", encoding="utf-8")
              sys.exit(0)

          fe = re.compile(
              r"\.(jsx?|tsx?|css|scss|sass|less|vue|mjs|cjs)(?:\s|$)",
              re.I,
          )
          exclude = re.compile(
              r"(^|/)(dist|build|coverage|\.next|storybook-static)(/|$)|"
              r"(^|/)(__snapshots__)(/|$)|"
              r"(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$",
              re.I,
          )

          def is_frontend_block(block: str) -> bool:
              m = re.search(r"^diff --git a/(.+?) b/(.+?)$", block, re.M)
              if not m:
                  return False
              a_path, b_path = m.group(1), m.group(2)
              if exclude.search(a_path) or exclude.search(b_path):
                  return False
              return bool(fe.search(a_path) or fe.search(b_path))

          def split_oversize(text: str) -> list[str]:
              if len(text) <= MAX:
                  return [text] if text else []
              lines = text.splitlines(keepends=True)
              out = []
              acc = ""
              for line in lines:
                  if len(line) > MAX:
                      if acc:
                          out.append(acc)
                          acc = ""
                      for i in range(0, len(line), MAX):
                          out.append(line[i:i + MAX])
                      continue
                  if acc and len(acc) + len(line) > MAX:
                      out.append(acc)
                      acc = line
                  else:
                      acc += line
              if acc:
                  out.append(acc)
              return out

          def pieces_for_file_block(block: str) -> list[str]:
              if len(block) <= MAX:
                  return [block]
              hunks = re.split(r"(?=^@@ )", block, flags=re.M)
              out = []
              for h in hunks:
                  if not h:
                      continue
                  out.extend(split_oversize(h))
              return out

          parts = re.split(r"(?=^diff --git )", raw, flags=re.M)
          file_blocks = [p for p in parts if p.strip() and is_frontend_block(p)]

          if not file_blocks:
              Path(".skip_ai").write_text("no_frontend_diff", encoding="utf-8")
              sys.exit(0)

          chunks = []
          buf = ""

          for block in file_blocks:
              for piece in pieces_for_file_block(block):
                  if buf and len(buf) + len(piece) > MAX:
                      chunks.append(buf)
                      buf = piece
                  else:
                      buf += piece

          if buf:
              chunks.append(buf)

          for i, c in enumerate(chunks):
              Path(f"chunk_{i:03d}").write_text(c, encoding="utf-8")

          Path(".chunk_count").write_text(str(len(chunks)), encoding="utf-8")
          PY

          if [ -f .skip_ai ]; then
            reason=$(cat .skip_ai)
            {
              echo "Overall Status: Pass"
              echo "Block Merge: No"
              echo "What Changed:"
              echo "- No frontend diff to review for this PR (reason: ${reason})."
              echo "High-Risk Findings:"
              echo "- None"
              echo "Medium Findings:"
              echo "- None"
              echo "Low/Style Findings:"
              echo "- None"
              echo "Unhandled Errors / Data Risks:"
              echo "- None"
              echo "Next Actions:"
              echo "- None"
              echo ""
              echo "Review Coverage:"
              echo "- Skipped: ${reason}"
            } > review.txt
            echo "REVIEW_PROVIDER=skipped" >> "$GITHUB_ENV"
            exit 0
          fi

          chunk_total=$(cat .chunk_count)
          echo "Total chunks (frontend-aware): ${chunk_total}"

          cat > shared_rules.txt <<'EOF'
          Rules:
          - Only report issues you can clearly justify from the diff text shown.
          - Do not guess or assume code outside the diff.
          - If context is incomplete, say "Unclear from diff" instead of inventing a bug.
          - Only include a finding if the failure path or risk is directly visible in the changed code.
          - Do not report hypothetical race conditions, stale state issues, lifecycle issues, or architectural concerns unless the diff clearly supports them.
          - Do not recommend retries, refactors, abstractions, or extra accessibility attributes unless their absence creates a concrete user-facing, reliability, or maintainability problem visible in the diff.
          - Ignore style-only nitpicks unless they materially affect readability or maintainability.
          - Prefer 1 to 3 high-confidence findings over a longer list of speculative findings.
          - If a point is only a possibility, leave it out.
          EOF

          cat > chunk_prompt.txt <<'EOF'
          You are reviewing one chunk of a pull request diff for frontend code.

          Use Shared Rules below.

          Review only what is visible in this chunk.
          Do not infer behavior from files or code not shown here.

          Return plain text with exactly these sections and headings:

          Chunk Summary:
          - max 3 bullets about what changed in this chunk

          High-Risk Findings:
          - bullets tied to clearly visible diff behavior, or None

          Medium Findings:
          - bullets tied to clearly visible diff behavior, or None

          Low/Style Findings:
          - bullets only for concrete maintainability/readability issues, or None

          Unhandled Errors / Data Risks:
          - bullets only if a missing failure path or unsafe data handling is directly visible, or None

          Next Actions:
          - max 3 short, actionable bullets, or None

          Severity guidance:
          - HIGH = likely production bug, crash risk, infinite loop, memory leak, or serious wrong-data risk
          - MEDIUM = important reliability, maintainability, or performance issue that is directly visible
          - LOW = minor but concrete cleanup issue

          Extra review guidance:
          - Do not include hypothetical concerns.
          - Do not include generic best-practice advice.
          - Do not suggest refactors unless repetition or complexity is clearly visible in this chunk.
          - If no strong issue is visible, return None in findings sections.

          --- Shared Rules ---
          EOF
          cat shared_rules.txt >> chunk_prompt.txt

          cat > final_prompt.txt <<'EOF'
          You are merging multiple chunk reviews of the same frontend PR.

          Use Shared Rules below.

          Your job is to:
          - deduplicate overlapping findings
          - remove weak or speculative findings
          - keep only credible issues supported by the chunk reviews
          - produce one concise, manager-friendly final review

          Do not invent new findings.
          Do not repeat the same concern in multiple sections.
          Use "None" when a section has no credible findings.

          Merge policy:
          - If there is at least one justified High-Risk Finding, set Block Merge: Yes.
          - Otherwise set Block Merge: No.
          - If there are credible Medium findings, Overall Status should usually be Needs Changes.
          - If there are only Low findings or no credible findings, Overall Status may be Pass.

          Return plain text in this exact format:

          Overall Status: Pass or Needs Changes
          Block Merge: Yes or No
          What Changed:
          - 2 to 4 short bullets summarizing the PR theme from chunk summaries only

          High-Risk Findings:
          - bullets, or None

          Medium Findings:
          - bullets, or None

          Low/Style Findings:
          - bullets, or None

          Unhandled Errors / Data Risks:
          - bullets, or None

          Next Actions:
          - up to 5 short actionable bullets, or None

          Final review guidance:
          - Prefer fewer, stronger findings over many weak ones.
          - Remove speculative or generic comments.
          - Keep only findings with clear practical value.

          --- Shared Rules ---
          EOF
          cat shared_rules.txt >> final_prompt.txt

          cat > openai_system.txt <<'EOF'
          You are a strict senior frontend PR reviewer.
          Follow the requested output structure exactly.
          Only report issues supported by the provided diff or chunk reviews.
          Do not guess missing context.
          Do not include speculative or generic best-practice comments.
          Prefer fewer, higher-confidence findings.
          Keep output concise and manager-friendly.
          EOF

          mapfile -t chunk_files < <(find . -maxdepth 1 -type f -name 'chunk_[0-9]*' | sort -V)

          if [ "${#chunk_files[@]}" -eq 0 ]; then
            {
              echo "Overall Status: Pass"
              echo "Block Merge: No"
              echo "What Changed:"
              echo "- No frontend chunk files were produced."
              echo "High-Risk Findings:"
              echo "- None"
              echo "Medium Findings:"
              echo "- None"
              echo "Low/Style Findings:"
              echo "- None"
              echo "Unhandled Errors / Data Risks:"
              echo "- None"
              echo "Next Actions:"
              echo "- None"
              echo ""
              echo "Review Coverage:"
              echo "- Skipped: no_chunks"
            } > review.txt
            echo "REVIEW_PROVIDER=skipped" >> "$GITHUB_ENV"
            exit 0
          fi

          reviewed_chunks=0
          failed_chunks=""

          for chunk_file in "${chunk_files[@]}"; do
            echo "Reviewing ${chunk_file}"

            jq -Rs --arg instruction "$(cat chunk_prompt.txt)" \
              '{contents:[{parts:[{text:($instruction + "\n\nChunk Diff:\n" + .)}]}]}' \
              "${chunk_file}" > request.json

            chunk_provider=""
            chunk_review_file="chunk_reviews/$(basename "${chunk_file}").txt"

            if [ -n "${GEMINI_API_KEY:-}" ] && [ -z "${chunk_provider}" ]; then
              gemini_http=$(curl -sS -o review.json -w "%{http_code}" -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d @request.json || true)
              if [ "${gemini_http}" = "200" ] && ! jq -e 'has("error")' review.json >/dev/null 2>&1; then
                jq -r '.candidates[0].content.parts[0].text // empty' review.json > "${chunk_review_file}"
                if [ -s "${chunk_review_file}" ]; then
                  chunk_provider="Gemini"
                fi
              fi
            fi

            if [ -n "${CLAUDE_API_KEY:-}" ] && [ -z "${chunk_provider}" ]; then
              jq -n \
                --arg diff "$(cat "${chunk_file}")" \
                --arg instruction "$(jq -r '.contents[0].parts[0].text' request.json)" \
                '{model:"claude-3-5-sonnet-latest",max_tokens:1200,messages:[{role:"user",content:($instruction + "\n\nChunk Diff:\n" + $diff)}]}' \
                > claude_request.json

              claude_http=$(curl -sS -o claude_response.json -w "%{http_code}" -X POST \
                "https://api.anthropic.com/v1/messages" \
                -H "content-type: application/json" \
                -H "x-api-key: ${CLAUDE_API_KEY}" \
                -H "anthropic-version: 2023-06-01" \
                -d @claude_request.json || true)

              if [ "${claude_http}" = "200" ]; then
                jq -r '[.content[]? | select(.type=="text") | .text] | join("\n")' claude_response.json > "${chunk_review_file}"
                if [ -s "${chunk_review_file}" ]; then
                  chunk_provider="Claude"
                fi
              fi
            fi

            if [ -n "${OPENAI_API_KEY:-}" ] && [ -z "${chunk_provider}" ]; then
              jq -n \
                --arg prompt "$(jq -r '.contents[0].parts[0].text' request.json)" \
                --arg system "$(cat openai_system.txt)" \
                '{model:"gpt-4.1-mini",messages:[{role:"system",content:$system},{role:"user",content:$prompt}],temperature:0.1}' \
                > openai_request.json

              openai_http=$(curl -sS -o openai_response.json -w "%{http_code}" -X POST \
                "https://api.openai.com/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${OPENAI_API_KEY}" \
                -d @openai_request.json || true)

              if [ "${openai_http}" = "200" ]; then
                jq -r '.choices[0].message.content // empty' openai_response.json > "${chunk_review_file}"
                if [ -s "${chunk_review_file}" ]; then
                  chunk_provider="OpenAI"
                fi
              fi
            fi

            if [ -z "${chunk_provider}" ]; then
              failed_chunks="${failed_chunks} $(basename "${chunk_file}")"
              echo "Failed to review ${chunk_file}"
            else
              reviewed_chunks=$((reviewed_chunks + 1))
              echo "Chunk ${chunk_file} reviewed by ${chunk_provider}"
            fi
          done

          if [ "${reviewed_chunks}" -eq 0 ]; then
            {
              echo "Overall Status: Needs Changes"
              echo "Block Merge: No"
              echo "What Changed:"
              echo "- Unable to generate AI review from configured providers."
              echo "High-Risk Findings:"
              echo "- None"
              echo "Medium Findings:"
              echo "- None"
              echo "Low/Style Findings:"
              echo "- None"
              echo "Unhandled Errors / Data Risks:"
              echo "- AI review unavailable."
              echo "Next Actions:"
              echo "- Re-run workflow."
              echo "- Verify GEMINI_API_KEY, CLAUDE_API_KEY, and OPENAI_API_KEY."
              echo ""
              echo "Review Coverage:"
              echo "- Reviewed chunks: 0/${chunk_total}"
              echo "- Failed chunks:${failed_chunks:- None}"
            } > review.txt
            echo "REVIEW_PROVIDER=unavailable" >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t review_files < <(find chunk_reviews -maxdepth 1 -type f -name 'chunk_*.txt' | sort -V)

          if [ "${#review_files[@]}" -eq 0 ]; then
            {
              echo "Overall Status: Needs Changes"
              echo "Block Merge: No"
              echo "What Changed:"
              echo "- Chunk reviews were expected but no output files were found."
              echo "High-Risk Findings:"
              echo "- None"
              echo "Medium Findings:"
              echo "- None"
              echo "Low/Style Findings:"
              echo "- None"
              echo "Unhandled Errors / Data Risks:"
              echo "- AI review incomplete."
              echo "Next Actions:"
              echo "- Re-run workflow."
            } > review.txt
            echo "REVIEW_PROVIDER=unavailable" >> "$GITHUB_ENV"
            exit 0
          fi

          cat "${review_files[@]}" > combined_reviews.txt

          jq -Rs --arg instruction "$(cat final_prompt.txt)" \
            '{contents:[{parts:[{text:($instruction + "\n\nChunk Reviews:\n" + .)}]}]}' \
            combined_reviews.txt > final_request.json

          provider=""

          if [ -n "${GEMINI_API_KEY:-}" ] && [ -z "${provider}" ]; then
            final_gemini_http=$(curl -sS -o final_review.json -w "%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @final_request.json || true)
            if [ "${final_gemini_http}" = "200" ] && ! jq -e 'has("error")' final_review.json >/dev/null 2>&1; then
              jq -r '.candidates[0].content.parts[0].text // empty' final_review.json > review.txt
              if [ -s review.txt ]; then
                provider="Gemini"
              fi
            fi
          fi

          if [ -n "${CLAUDE_API_KEY:-}" ] && [ -z "${provider}" ]; then
            jq -n \
              --arg summary "$(cat combined_reviews.txt)" \
              --arg instruction "$(jq -r '.contents[0].parts[0].text' final_request.json)" \
              '{model:"claude-3-5-sonnet-latest",max_tokens:1400,messages:[{role:"user",content:($instruction + "\n\nChunk Reviews:\n" + $summary)}]}' \
              > final_claude_request.json

            final_claude_http=$(curl -sS -o final_claude_response.json -w "%{http_code}" -X POST \
              "https://api.anthropic.com/v1/messages" \
              -H "content-type: application/json" \
              -H "x-api-key: ${CLAUDE_API_KEY}" \
              -H "anthropic-version: 2023-06-01" \
              -d @final_claude_request.json || true)

            if [ "${final_claude_http}" = "200" ]; then
              jq -r '[.content[]? | select(.type=="text") | .text] | join("\n")' final_claude_response.json > review.txt
              if [ -s review.txt ]; then
                provider="Claude"
              fi
            fi
          fi

          if [ -n "${OPENAI_API_KEY:-}" ] && [ -z "${provider}" ]; then
            jq -n \
              --arg prompt "$(jq -r '.contents[0].parts[0].text' final_request.json)" \
              --arg system "$(cat openai_system.txt)" \
              '{model:"gpt-4.1-mini",messages:[{role:"system",content:$system},{role:"user",content:$prompt}],temperature:0.1}' \
              > final_openai_request.json

            final_openai_http=$(curl -sS -o final_openai_response.json -w "%{http_code}" -X POST \
              "https://api.openai.com/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -d @final_openai_request.json || true)

            if [ "${final_openai_http}" = "200" ]; then
              jq -r '.choices[0].message.content // empty' final_openai_response.json > review.txt
              if [ -s review.txt ]; then
                provider="OpenAI"
              fi
            fi
          fi

          if [ -z "${provider}" ]; then
            {
              echo "Overall Status: Needs Changes"
              echo "Block Merge: No"
              echo "What Changed:"
              echo "- Final AI synthesis was unavailable."
              echo "- Partial chunk reviews were generated."
              echo "High-Risk Findings:"
              echo "- Unclear from diff"
              echo "Medium Findings:"
              echo "- Unclear from diff"
              echo "Low/Style Findings:"
              echo "- Unclear from diff"
              echo "Unhandled Errors / Data Risks:"
              echo "- Final synthesis failed; see raw chunk reviews in workflow logs."
              echo "Next Actions:"
              echo "- Re-run workflow for full synthesis."
              echo "- Inspect chunk review logs if needed."
            } > review.txt
            provider="fallback"
          fi

          {
            echo ""
            echo "Review Coverage:"
            echo "- Reviewed chunks: ${reviewed_chunks}/${chunk_total}"
            if [ -n "${failed_chunks}" ]; then
              echo "- Failed chunks:${failed_chunks}"
            else
              echo "- Failed chunks: None"
            fi
          } >> review.txt

          echo "Review provider used: ${provider}"
          echo "REVIEW_PROVIDER=${provider}" >> "$GITHUB_ENV"

      - name: Print AI review
        shell: bash
        run: |
          echo "=== AI PR Review (${REVIEW_PROVIDER}) ==="
          cat review.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### AI PR Review (${REVIEW_PROVIDER})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat review.txt >> "$GITHUB_STEP_SUMMARY"